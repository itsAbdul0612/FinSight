spring:
  application:
    name: finsight

  mvc:
    format:
      date: iso
      date-time: iso

  # Database config

  datasource:
    url: <localhost or cloud url>
    username: <username if any>
    password: <password>

  jpa:
    hibernate:
      ddl-auto: <choose a mode>

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  # OAuth config

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: <client-id>
            client-secret: <client-secret>

  # tools

  devtool:
    restart:
      enable: true

  # email configs

  mail:
    host: smtp.gmail.com
    port: 587 (default port for gmail smtp server)
    username: <youremail@gmail.com>
    password: <your-16-char-app-password>
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


#Redis config

  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379
      password: <your password> or just remove this key if you don't want any password.
      ssl:
        enable: false

#        Spring AI

  ai:
    openai:
      api-key: <key>
      base-url: https://api.groq.com/openai/v1
      chat:
        options:
          model: qwen/qwen3.8-27b
          temperature: 0.8
    chat:
      memory:
        repository:
          redis:
            host: <host>
            port: <port>
            password: <password>
            max-messages-per-conversation: 400
            time-to-live: 40m

# logging configurations

logging:

  file:
    name: application.log

  config: "classpath: logback-spring.xml"

  level:
    org.springframework.transaction: DEBUG
    com.technerd.finsight: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

jwt:
  secret-key: <secret_key>

#  Documentation

springdoc:
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.technerd.finsight
  show-actuator: false