spring:
  application:
    name: finsight


  # Database config

  datasource:
    url: <localhost or cloud url>
    username: <username if any>
    password: <password>

  jpa:
    hibernate:
      ddl-auto: <choose a mode>
  show-sql: true
  properties:
    hibernate:
      format_sql: true

# OAuth config

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: <client-id>
            client-secret: <client-secret>