spring:
  datasource:
    url: jdbc:h2:mem:finsight;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client
            client-secret: test-secret
  mail:
    host: localhost
    port: 2525
    username: test
    password: test
  data:
    redis:
      host: localhost
      port: 6379
      password: test
  ai:
    openai:
      api-key: test-key
  cache:
    type: simple

jwt:
  secret-key: test-secret-key-with-at-least-32-characters
